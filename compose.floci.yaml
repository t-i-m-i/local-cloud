# Floci: a fake AWS that runs on your laptop. This file starts it.
# It is separate from compose.yaml on purpose: the plain local app never needs it.
#
#   docker compose -f compose.floci.yaml up -d      start Floci
#   docker compose -f compose.floci.yaml down       stop Floci
#
# (The `floci start` command from Homebrew also works, but it runs Floci on
# Docker's default network, where Floci cannot reach the ECR registry it creates.
# Using this file gives Floci a network of its own, which fixes that.)
name: floci

services:
  floci:
    image: floci/floci:latest
    ports:
      # All fake AWS APIs answer on this one port: http://localhost:4566
      - "4566:4566"
      # Fake RDS databases are reachable on ports in this range.
      - "7001-7099:7001-7099"
    volumes:
      # Floci starts real containers (RDS database, ECS tasks, ECR registry)
      # by talking to Docker through this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # The Docker network Floci puts its helper containers on, so they can all
      # reach each other by name.
      FLOCI_SERVICES_DOCKER_NETWORK: floci_default
      # Names that Floci hands out in URLs. localhost.floci.io is a public DNS
      # name that points at 127.0.0.1 on your Mac, and (via the alias below) at
      # Floci from inside the Docker network. One name that works from both sides.
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      # Lets a running ECS task fetch temporary "task role" credentials, like on real AWS.
      FLOCI_SERVICES_ECS_TASK_ROLE_CREDENTIALS_ENABLED: "true"
    networks:
      floci_default:
        aliases:
          - localhost.floci.io

networks:
  floci_default:
    name: floci_default
